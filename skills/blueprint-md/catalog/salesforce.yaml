# Salesforce & MuleSoft building blocks for blueprint-md.
# Keep entries short and stable: what it is, when to use it, when not to, and a link to the official docs.
# Numbers that change between releases (limits, retention, allocations) belong in the linked docs, not here.
# MuleSoft has only a wide wordmark in the public logo libraries, so its blocks use pictograms.
# `checked` = month the entry and its link were last verified. Run `blueprint.py catalog --check` after each release.

title: Salesforce & MuleSoft
entries:

  # ── Clouds & products ───────────────────────────────────────────────────────
  salesforce/org:
    name: Salesforce Org
    kind: salesforce org
    category: Clouds & products
    icon: salesforce
    what: One Salesforce environment (production or sandbox) with its own data, metadata, users and limits.
    use_when: Use it as a group around the clouds and features that share one org.
    avoid_when: Don't draw several orgs as one; multi-org setups need explicit org-to-org integration.
    docs: https://www.salesforce.com/platform/
    checked: 2026-11

  salesforce/sales-cloud:
    name: Sales Cloud
    kind: crm
    category: Clouds & products
    icon: salesforce
    what: CRM for accounts, contacts, leads, opportunities, quotes and orders.
    use_when: The system of record for customers and the sales pipeline.
    avoid_when: Complex pricing, billing or fulfilment usually stays in an ERP or a dedicated revenue product.
    connects_with: [salesforce/platform-event, salesforce/change-data-capture, salesforce/rest-api, mulesoft/process-api]
    docs: https://www.salesforce.com/sales/
    checked: 2026-11

  salesforce/service-cloud:
    name: Service Cloud
    kind: customer service
    category: Clouds & products
    icon: salesforce
    what: Case management, omni-channel routing, knowledge and contact-center tooling for support teams.
    use_when: Customer support, complaints and service processes with SLAs.
    avoid_when: Pure field work scheduling (use Field Service on top of it).
    connects_with: [salesforce/sales-cloud, salesforce/experience-cloud, salesforce/agentforce]
    docs: https://www.salesforce.com/service/
    checked: 2026-11

  salesforce/experience-cloud:
    name: Experience Cloud
    kind: portal
    category: Clouds & products
    icon: salesforce
    what: Portals, partner sites and customer self-service sites built on the org's data and security model.
    use_when: Customers or partners need to log in and see or change their own Salesforce records.
    avoid_when: High-traffic public marketing sites or storefronts (use a CMS or Commerce Cloud).
    connects_with: [salesforce/sales-cloud, salesforce/service-cloud, salesforce/lwc]
    docs: https://help.salesforce.com/s/articleView?id=experience.networks_overview.htm&type=5
    checked: 2026-11

  salesforce/marketing-cloud:
    name: Marketing Cloud
    kind: marketing
    category: Clouds & products
    icon: salesforce
    what: Email, mobile and journey-based marketing automation.
    use_when: Campaigns, newsletters and customer journeys across channels.
    avoid_when: Transactional system messages that must be sent from the core process (send them from that process).
    connects_with: [salesforce/data-cloud, salesforce/sales-cloud]
    docs: https://www.salesforce.com/marketing/
    checked: 2026-11

  salesforce/commerce-cloud:
    name: Commerce Cloud
    kind: e-commerce
    category: Clouds & products
    icon: salesforce
    what: B2C and B2B storefronts, carts, checkout and order management.
    use_when: Online stores and self-service ordering with catalogs and pricing.
    avoid_when: A few order forms for existing customers (Experience Cloud can be enough).
    connects_with: [salesforce/sales-cloud, mulesoft/process-api]
    docs: https://www.salesforce.com/commerce/
    checked: 2026-11

  salesforce/data-cloud:
    name: Data Cloud
    kind: customer data
    category: Clouds & products
    icon: salesforce
    what: Ingests and unifies customer data from many sources into profiles, segments and calculated insights.
    use_when: A unified customer view across systems, segmentation, or grounding data for AI.
    avoid_when: Simple point-to-point sync of a few objects (an integration is cheaper).
    connects_with: [salesforce/marketing-cloud, salesforce/agentforce, salesforce/sales-cloud]
    docs: https://www.salesforce.com/data/
    checked: 2026-11

  salesforce/agentforce:
    name: Agentforce
    kind: ai agents
    category: Clouds & products
    icon: salesforce
    what: AI agents that answer questions and take actions using org data, flows, Apex and prompt templates.
    use_when: Self-service or employee assistants that need to act on Salesforce data.
    avoid_when: Deterministic processes with no language understanding (use Flow or Apex).
    connects_with: [salesforce/data-cloud, salesforce/flow, salesforce/apex, salesforce/service-cloud]
    docs: https://www.salesforce.com/agentforce/
    checked: 2026-11

  salesforce/field-service:
    name: Field Service
    kind: field operations
    category: Clouds & products
    icon: salesforce
    what: Work orders, scheduling, dispatch and a mobile app for technicians in the field.
    use_when: On-site service with appointments, crews and parts.
    avoid_when: Pure remote support (Service Cloud alone).
    connects_with: [salesforce/service-cloud]
    docs: https://www.salesforce.com/service/field-service-management/
    checked: 2026-11

  salesforce/tableau:
    name: Tableau
    kind: analytics
    category: Clouds & products
    icon: tableau
    what: Analytics and dashboards across Salesforce and non-Salesforce data.
    use_when: Cross-system reporting and visual analysis.
    avoid_when: Operational lists and simple KPIs inside one org (standard reports and dashboards).
    docs: https://www.tableau.com/
    checked: 2026-11

  salesforce/slack:
    name: Slack
    kind: collaboration
    category: Clouds & products
    icon: slack
    what: Messaging and workflows for teams, with Salesforce records and alerts in channels.
    use_when: Notifying people, approvals and swarming on records where teams already work.
    avoid_when: As a system of record or an integration bus.
    docs: https://slack.com/
    checked: 2026-11

  salesforce/heroku:
    name: Heroku
    kind: app platform
    category: Clouds & products
    icon: heroku
    what: Managed platform to run custom apps, APIs and workers in common languages, with managed Postgres.
    use_when: Custom code that doesn't fit the platform's limits, such as heavy compute, long jobs or public high-traffic apps.
    avoid_when: Logic that only needs Salesforce data and fits Flow or Apex.
    connects_with: [salesforce/rest-api, salesforce/pub-sub-api]
    docs: https://www.heroku.com/
    checked: 2026-11

  # ── Automation & code ───────────────────────────────────────────────────────
  salesforce/flow:
    name: Flow
    kind: automation
    category: Automation & code
    icon: lucide:workflow
    what: Declarative automation with record-triggered, scheduled, screen and autolaunched flows.
    use_when: Business logic and automation that admins should be able to maintain.
    avoid_when: Very complex logic, large data volumes or heavy callouts (use Apex).
    connects_with: [salesforce/platform-event, salesforce/apex, salesforce/named-credential]
    docs: https://help.salesforce.com/s/articleView?id=platform.flow.htm&type=5
    checked: 2026-11

  salesforce/apex:
    name: Apex
    kind: server-side code
    category: Automation & code
    icon: lucide:code-xml
    what: Salesforce's server-side language for triggers, services, batch jobs, REST endpoints and callouts.
    use_when: Complex logic, custom APIs, bulk processing and integrations that Flow can't express well.
    avoid_when: Simple automation that Flow can handle and admins should own.
    connects_with: [salesforce/named-credential, salesforce/platform-event, salesforce/flow]
    docs: https://developer.salesforce.com/docs/platform/apex-dev/references/apex-dev/apex-intro-what-is-apex.html
    checked: 2026-11

  salesforce/lwc:
    name: Lightning Web Components
    kind: ui components
    category: Automation & code
    icon: lucide:layout-template
    what: Standards-based web components for custom UI in Lightning, Experience Cloud and mobile.
    use_when: Custom screens or interactions beyond standard pages.
    avoid_when: Standard record pages, dynamic forms or screen flows already do the job.
    connects_with: [salesforce/apex, salesforce/experience-cloud]
    docs: https://developer.salesforce.com/docs/platform/lwc/guide
    checked: 2026-11

  # ── Integration ─────────────────────────────────────────────────────────────
  salesforce/platform-event:
    name: Platform Event
    kind: event bus
    category: Integration
    icon: lucide:zap
    what: Publish/subscribe messages inside Salesforce and to external subscribers, with replay for a limited time.
    use_when: Fire-and-forget notifications to other systems and decoupling processes in near real time.
    avoid_when: Request-reply calls that need an immediate answer, or bulk data loads.
    connects_with: [salesforce/pub-sub-api, mulesoft/process-api, salesforce/flow, salesforce/apex]
    docs: https://developer.salesforce.com/docs/platform/platform-events/guide/platform-events-intro.html
    checked: 2026-11

  salesforce/change-data-capture:
    name: Change Data Capture
    kind: change events
    category: Integration
    icon: lucide:history
    what: Publishes an event for every create, update, delete and undelete on selected objects.
    use_when: Keeping an external copy of Salesforce records in sync in near real time.
    avoid_when: You only need specific business events (publish a Platform Event instead).
    connects_with: [salesforce/pub-sub-api, mulesoft/system-api]
    docs: https://developer.salesforce.com/docs/platform/change-data-capture/guide/cdc-intro.html
    checked: 2026-11

  salesforce/pub-sub-api:
    name: Pub/Sub API
    kind: event api (grpc)
    category: Integration
    icon: lucide:radio-tower
    what: gRPC API for external clients to publish and subscribe to Platform Events and Change Data Capture events.
    use_when: External systems or middleware consume Salesforce events reliably with replay.
    avoid_when: Simple low-volume webhooks where a callout from Flow is enough.
    connects_with: [salesforce/platform-event, salesforce/change-data-capture, mulesoft/process-api]
    docs: https://developer.salesforce.com/docs/platform/pub-sub-api/overview
    checked: 2026-11

  salesforce/rest-api:
    name: REST API
    kind: inbound api
    category: Integration
    icon: lucide:globe
    what: Standard API for external systems to read and write Salesforce records and run queries.
    use_when: Remote call-in, where an external system creates or reads records on demand.
    avoid_when: Large data volumes (use the Bulk API) or chatty polling (use events).
    connects_with: [salesforce/connected-app, mulesoft/system-api]
    docs: https://developer.salesforce.com/docs/platform/api-rest/guide/intro-rest.html
    checked: 2026-11

  salesforce/bulk-api:
    name: Bulk API 2.0
    kind: bulk data api
    category: Integration
    icon: lucide:upload
    what: Asynchronous API for loading, updating or extracting large numbers of records in jobs.
    use_when: Migrations, nightly batch syncs and anything above a few thousand records at once.
    avoid_when: Single-record, real-time interactions.
    connects_with: [salesforce/connected-app, mulesoft/system-api]
    docs: https://developer.salesforce.com/docs/platform/api-asynch/guide/asynch-api-intro.html
    checked: 2026-11

  salesforce/named-credential:
    name: Named Credential
    kind: outbound auth
    category: Integration
    icon: lucide:key-round
    what: Stores the endpoint and authentication for outbound callouts, so code and flows never hold secrets.
    use_when: Every callout from Apex or Flow to an external system.
    avoid_when: Never hard-code endpoints or credentials instead.
    connects_with: [salesforce/apex, salesforce/flow]
    docs: https://help.salesforce.com/s/articleView?id=xcloud.named_credentials_about.htm&type=5
    checked: 2026-11

  salesforce/connected-app:
    name: Connected / External Client App
    kind: inbound auth
    category: Integration
    icon: lucide:shield-check
    what: Registers an external application for OAuth access to Salesforce APIs, with scopes and policies.
    use_when: Any external system or middleware that calls Salesforce APIs.
    avoid_when: Sharing one integration user and app across unrelated systems.
    connects_with: [salesforce/rest-api, salesforce/bulk-api, salesforce/pub-sub-api]
    docs: https://help.salesforce.com/s/articleView?id=xcloud.connected_app_overview.htm&type=5
    checked: 2026-11

  salesforce/salesforce-connect:
    name: Salesforce Connect
    kind: data virtualization
    category: Integration
    icon: lucide:plug
    what: Shows data from external systems as external objects without copying it into Salesforce.
    use_when: Users need to see large or frequently changing external data in context without storing it.
    avoid_when: Data must be reported on heavily, automated with triggers or available offline.
    connects_with: [mulesoft/system-api]
    docs: https://help.salesforce.com/s/articleView?id=platform.platform_connect_about.htm&type=5
    checked: 2026-11

  # ── MuleSoft ────────────────────────────────────────────────────────────────
  mulesoft/anypoint:
    name: MuleSoft Anypoint Platform
    kind: integration
    category: MuleSoft
    icon: lucide:workflow
    what: Integration platform to design, run and manage APIs and integrations.
    use_when: Use it as a group around Mule applications and APIs.
    avoid_when: A single simple point-to-point sync that the platform's own tools can handle.
    docs: https://docs.mulesoft.com/general/
    checked: 2026-11

  mulesoft/experience-api:
    name: Experience API
    kind: experience api
    category: MuleSoft
    icon: lucide:app-window
    what: API-led layer shaped for one consumer, such as a mobile app, portal or partner.
    use_when: Different channels need differently shaped data from the same processes.
    avoid_when: Only one consumer exists and the process API already fits it.
    connects_with: [mulesoft/process-api]
    docs: https://docs.mulesoft.com/general/api-led-overview
    checked: 2026-11

  mulesoft/process-api:
    name: Process API
    kind: process api
    category: MuleSoft
    icon: lucide:git-merge
    what: API-led layer that orchestrates business processes across systems and maps data between them.
    use_when: Logic that combines several systems, such as order-to-cash or customer onboarding.
    avoid_when: Direct system access (that belongs in a system API).
    connects_with: [mulesoft/system-api, mulesoft/experience-api, salesforce/pub-sub-api]
    docs: https://docs.mulesoft.com/general/api-led-overview
    checked: 2026-11

  mulesoft/system-api:
    name: System API
    kind: system api
    category: MuleSoft
    icon: lucide:plug
    what: API-led layer that exposes one backend system (ERP, database, Salesforce) through a stable interface.
    use_when: Hide a system's protocols and quirks so it can change without breaking consumers.
    avoid_when: Putting cross-system business logic inside it.
    connects_with: [mulesoft/process-api, salesforce/rest-api, salesforce/bulk-api]
    docs: https://docs.mulesoft.com/general/api-led-overview
    checked: 2026-11

  mulesoft/api-manager:
    name: API Manager
    kind: api governance
    category: MuleSoft
    icon: lucide:shield-check
    what: Applies policies such as client ID enforcement, rate limiting and OAuth to APIs, and tracks their use.
    use_when: APIs are consumed by several teams or external partners.
    avoid_when: Internal one-off integrations with no consumers to govern.
    docs: https://docs.mulesoft.com/api-manager/latest/
    checked: 2026-11

  mulesoft/cloudhub:
    name: CloudHub 2.0
    kind: mule runtime
    category: MuleSoft
    icon: lucide:cloud
    what: MuleSoft's managed, containerized cloud runtime for Mule applications.
    use_when: Running Mule apps without operating your own servers.
    avoid_when: Data must stay on-premises (use Runtime Fabric or hybrid deployment).
    docs: https://docs.mulesoft.com/cloudhub-2/
    checked: 2026-11
